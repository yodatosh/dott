[package]
name = "dott"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
description = "Local domain search"
license = "MIT"
repository = "https://github.com/yodatosh/dott"
homepage = "https://github.com/yodatosh/dott"
keywords = ["domain", "whois", "rdap", "dns", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
futures = "0.3.32"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.27"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[features]
default = ["self-update"]
self-update = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
