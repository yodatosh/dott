name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: dott-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate tag and locked package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          python3 Tools/release.py check --tag "$RELEASE_TAG" --previous "$PREVIOUS"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked
      - run: python3 -m unittest discover -s Tools -p 'test_*.py'
      - run: sh -n install.sh

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="dott-${{ matrix.target }}.tar.gz"
          tar czf "$TARBALL" -C "target/${{ matrix.target }}/release" dott
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$TARBALL" > "$TARBALL.sha256"
          else
            shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dott-${{ matrix.target }}
          path: |
            dott-${{ matrix.target }}.tar.gz
            dott-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: dott-*
          path: dist
          merge-multiple: true
      - name: Verify all assets and generate formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          python3 Tools/release.py formula --tag "$RELEASE_TAG" --previous "$PREVIOUS" --assets dist
      - name: Create draft, upload all assets, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json isDraft > release.json; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to modify an already published release"'
          else
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --repo "$RELEASE_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: dott-formula
          path: Formula/dott.rb
          if-no-files-found: error

  update-formula:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/download-artifact@v4
        with:
          name: dott-formula
          path: Formula
      - name: Push formula for the published release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dott.rb
          if ! git diff --cached --quiet; then
            git commit -m "dott ${RELEASE_TAG#v}"
            git push
          fi
